<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itaú Asset · Acesso restrito</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #001B36 0%, #003366 60%, #004080 100%);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      background: #F97316;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: -1px;
    }

    .logo-title {
      color: white;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .logo-sub {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: -6px;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 13px 16px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]::placeholder { color: rgba(255,255,255,0.25); }
    input[type="password"]:focus { border-color: #F97316; }

    .erro {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px;
      padding: 10px 14px;
      color: #FCA5A5;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .erro.visivel { display: block; }

    button[type="submit"] {
      width: 100%;
      background: #F97316;
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: #ea6c0f; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

    .footer {
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-badge">IA</div>
      <span class="logo-title">Itaú Asset</span>
      <span class="logo-sub">Instagram Dashboard</span>
    </div>

    <form method="POST" action="/api/auth" id="form">
      <div>
        <label for="senha">Senha de acesso</label>
        <input type="password" id="senha" name="password" placeholder="••••••••••••••••" autocomplete="current-password" autofocus />
      </div>
      <div class="erro" id="erro">Senha incorreta. Tente novamente.</div>
      <button type="submit" id="btn">Entrar</button>
    </form>

    <p class="footer">Acesso restrito · Itaú Asset Management</p>
  </div>

  <script>
    // Mostra erro se redirecionado com ?erro=1
    if (location.search.includes('erro=1')) {
      document.getElementById('erro').classList.add('visivel')
    }

    document.getElementById('form').addEventListener('submit', function() {
      document.getElementById('btn').disabled = true
      document.getElementById('btn').textContent = 'Verificando...'
    })
  </script>
</body>
</html>
